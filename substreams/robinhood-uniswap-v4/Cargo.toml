[workspace]

[package]
name = "investmade_robinhood_uniswap_v4"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ethabi = "17"
prost = "0.13"
prost-types = "0.13"
substreams = "0.7"
substreams-ethereum = "0.11"

[build-dependencies]
prost-build = "0.13"
substreams-ethereum = "0.11"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
